<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Entrar · VIRA-BICHO Observatório</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/app.css" />
  </head>
  <body class="login-body">
    <main class="login">
      <div class="brand">
        <span class="logo" aria-hidden="true"></span>
        <div>
          <h1>VIRA-BICHO</h1>
          <p class="sub">observatório</p>
        </div>
      </div>
      <form method="post" action="/login" autocomplete="off">
        <label for="token">Token de acesso</label>
        <input id="token" name="token" type="password" required autofocus spellcheck="false" autocapitalize="off" />
        <p class="err"><!--MSG--></p>
        <button type="submit">Entrar</button>
      </form>
      <p class="muted small">O token fica em <code>~/.config/vira-bicho/secrets.env</code> no celular (OBS_TOKEN).</p>
    </main>
  </body>
</html>
